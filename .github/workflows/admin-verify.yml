name: Verify admin dashboard
on:
  push:
    paths: ['admin dashboard/**', '.github/workflows/admin-verify.yml', '.github/workflows/native-release.yml', '.github/workflows/macos-dmg.yml', 'scripts/publish-native-release.mjs', 'scripts/prepare-native-release.mjs', 'components/ui/Icons.tsx', 'components/ui/solar-data.json', 'lib/motion.ts']
  pull_request:
    paths: ['admin dashboard/**', '.github/workflows/admin-verify.yml', '.github/workflows/native-release.yml', '.github/workflows/macos-dmg.yml', 'scripts/publish-native-release.mjs', 'scripts/prepare-native-release.mjs', 'components/ui/Icons.tsx', 'components/ui/solar-data.json', 'lib/motion.ts']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin dashboard/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: admin dashboard
      - run: npm run audit:security
        working-directory: admin dashboard
      - run: npm run check
        working-directory: admin dashboard
      - run: npm run infra:synth
        working-directory: admin dashboard
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: ap-south-1
