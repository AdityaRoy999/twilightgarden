services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    restart: "no"
    # Development-only key: devkey / secret. Production MUST use generated secrets and TLS.
